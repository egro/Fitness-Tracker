<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fitness Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <a href="{% url 'tracker:dashboard' %}" class="font-bold text-lg">FT</a>
                <button id="mobile-menu-btn" class="md:hidden p-2" onclick="document.getElementById('nav-links').classList.toggle('hidden')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div id="nav-links" class="hidden md:flex md:items-center md:gap-1 absolute md:relative top-14 md:top-0 left-0 w-full md:w-auto bg-blue-600 md:bg-transparent z-10">
                    {% if user.is_authenticated %}
                    <a href="{% url 'tracker:weight_add' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Log Weight</a>
                    <a href="{% url 'tracker:measurement_add' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Measure</a>
                    <a href="{% url 'tracker:exercise_list' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Exercises</a>
                    <a href="{% url 'tracker:workout_add' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Workout</a>
                    <a href="{% url 'photos:gallery' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Photos</a>
                    <div class="border-t border-blue-500 md:border-0 md:ml-4">
                        <span class="block px-4 py-1 text-blue-200 text-sm">{{ user.username }}</span>
                        <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Settings</a>
                        <a href="{% url 'accounts:logout' %}" class="block px-4 py-2 hover:bg-blue-700 md:rounded">Logout</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-6">
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-3 rounded bg-green-100 text-green-800 border border-green-200 mb-1">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
