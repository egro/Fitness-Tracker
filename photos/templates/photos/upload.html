{% extends "base.html" %}
{% block title %}Upload Photos{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Upload Progress Photos</h1>

<form method="post" enctype="multipart/form-data" class="bg-white rounded-xl shadow p-4 max-w-md">
    {% csrf_token %}
    <label class="block mb-3">
        <span class="text-gray-700">Date</span>
        <input type="date" name="date" value="{{ today }}" max="{{ max_date }}" required
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>
    <label class="block mb-3">
        <span class="text-gray-700">Body Part / View</span>
        <select name="body_part" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
            <option value="front">Front</option>
            <option value="back">Back</option>
            <option value="left_side">Left Side</option>
            <option value="right_side">Right Side</option>
            <option value="other">Other</option>
        </select>
    </label>
    <label class="block mb-3">
        <span class="text-gray-700">Photos (select multiple)</span>
        <input type="file" name="images" multiple accept="image/*" required
               class="mt-1 block w-full">
    </label>
    <label class="block mb-4">
        <span class="text-gray-700">Notes</span>
        <textarea name="notes" rows="2" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"></textarea>
    </label>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Upload</button>
    <a href="{% url 'photos:gallery' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
</form>

{% endblock %}
