{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Settings</h1>

<form method="post" class="bg-white rounded-xl shadow p-4 max-w-md">
    {% csrf_token %}
    <label class="block mb-3">
        <span class="text-gray-700">Units</span>
        <select name="units" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
            <option value="metric" {% if form.units.value == "metric" %}selected{% endif %}>Metric (kg/cm)</option>
            <option value="imperial" {% if form.units.value == "imperial" %}selected{% endif %}>Imperial (lbs/in)</option>
        </select>
    </label>
    <label class="block mb-4">
        <span class="text-gray-700">Date of Birth</span>
        <input type="date" name="date_of_birth" value="{{ form.date_of_birth.value|default:"" }}"
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Settings</button>
</form>

{% endblock %}
