{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto mt-8">
    <h1 class="text-2xl font-bold mb-4 text-center">Login</h1>
    <form method="post" class="bg-white rounded-xl shadow p-6">
        {% csrf_token %}
        <label class="block mb-3">
            <span class="text-gray-700">Username</span>
            <input type="text" name="username" required
                   class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
        </label>
        <label class="block mb-4">
            <span class="text-gray-700">Password</span>
            <input type="password" name="password" required
                   class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
        </label>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
        {% if form.errors %}
        <p class="mt-3 text-red-500 text-sm">Invalid username or password.</p>
        {% endif %}
    </form>
    <p class="text-center mt-4 text-sm">
        Don't have an account? <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">Register</a>
    </p>
</div>

{% endblock %}
