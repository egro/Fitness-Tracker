{% extends "base.html" %}
{% block title %}Add Exercise{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Add Exercise</h1>

<form method="post" class="bg-white rounded-xl shadow p-4 max-w-md">
    {% csrf_token %}
    <label class="block mb-2">
        <span class="text-gray-700">Name</span>
        <input type="text" name="name" required
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>
    <label class="block mb-2">
        <span class="text-gray-700">Category <span class="text-gray-400 text-xs">(optional)</span></span>
        <select name="category" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
            <option value="">-- None --</option>
            {% for cat in categories %}
            <option value="{{ cat.pk }}">{{ cat.name }}</option>
            {% endfor %}
            <option value="__new__">+ Add new category...</option>
        </select>
    </label>
    <div id="new-category-field" class="hidden mb-2">
        <label class="block">
            <span class="text-gray-600 text-sm">New category name</span>
            <input type="text" name="new_category" placeholder="e.g. Chest, Back, Legs"
                   class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
        </label>
    </div>
    <script>
        document.querySelector('[name="category"]').addEventListener('change', function() {
            document.getElementById('new-category-field').classList.toggle('hidden', this.value !== '__new__');
        });
    </script>
    <label class="block mb-4">
        <span class="text-gray-700">Notes</span>
        <textarea name="notes" rows="2" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"></textarea>
    </label>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
    <a href="{% url 'tracker:exercise_list' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
</form>

{% endblock %}
