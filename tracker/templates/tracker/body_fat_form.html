{% extends "base.html" %}
{% block title %}Log Body Fat{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Log Body Fat</h1>

<form method="post" class="bg-white rounded-xl shadow p-4 max-w-lg">
    {% csrf_token %}
    <label class="block mb-3">
        <span class="text-gray-700">Date</span>
        <input type="date" name="date" id="id_date" required
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>

    <label class="block mb-3">
        <span class="text-gray-700">Body Fat %</span>
        <input type="number" name="body_fat_pct" step="0.1" min="1" max="70" required
               placeholder="e.g. 22.5"
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>

    <label class="block mb-3">
        <span class="text-gray-700">Method</span>
        <select name="method"
                class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
            <option value="dexa">DEXA Scan</option>
            <option value="caliper">Caliper</option>
            <option value="bodpod">Bod Pod</option>
            <option value="scale_bia">Bioimpedance Scale</option>
            <option value="photo_3d">3D Photo Scan</option>
            <option value="manual">Manual Entry</option>
        </select>
    </label>

    <label class="block mb-4">
        <span class="text-gray-700">Notes</span>
        <textarea name="notes" rows="2" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"></textarea>
    </label>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
    <a href="{% url 'tracker:body_fat_list' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
</form>

<script>
(function(){var d=new Date(),l=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),e=document.getElementById('id_date');e.value=l;e.max=l})();
</script>
{% endblock %}
