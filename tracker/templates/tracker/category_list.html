{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Exercise Categories</h1>

<div class="bg-white rounded-xl shadow p-4 max-w-lg mb-6">
    <form method="post" class="flex gap-2">
        {% csrf_token %}
        <input type="hidden" name="action" value="add">
        <input type="text" name="name" placeholder="New category name" required
               class="flex-1 rounded border border-gray-300 px-3 py-2">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add</button>
    </form>
</div>

<div class="space-y-2 max-w-lg">
    {% for cat in categories %}
    <div class="bg-white rounded-lg shadow px-4 py-3 flex items-center justify-between">
        <form method="post" class="flex items-center gap-2 flex-1">
            {% csrf_token %}
            <input type="hidden" name="action" value="rename">
            <input type="hidden" name="pk" value="{{ cat.pk }}">
            <input type="text" name="name" value="{{ cat.name }}" required
                   class="rounded border border-gray-300 px-2 py-1 flex-1">
            <button type="submit" class="text-blue-600 hover:underline text-sm">Rename</button>
        </form>
        <form method="post" class="ml-2" onsubmit="return confirm('Delete category &#39;{{ cat.name|escapejs }}&#39;?')">
            {% csrf_token %}
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="pk" value="{{ cat.pk }}">
            <button type="submit" class="text-red-500 hover:underline text-sm">Delete</button>
        </form>
    </div>
    {% empty %}
    <p class="text-gray-500">No categories yet. Create one above.</p>
    {% endfor %}
</div>

{% endblock %}
