{% extends "base.html" %}
{% block title %}Create Template{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Create Workout Template</h1>

<form method="post" class="bg-white rounded-xl shadow p-4 max-w-lg">
    {% csrf_token %}
    <label class="block mb-2">
        <span class="text-gray-700">Template Name</span>
        <input type="text" name="name" required
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>
    <label class="block mb-4">
        <span class="text-gray-700">Description</span>
        <textarea name="description" rows="2" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"></textarea>
    </label>

    <fieldset class="mb-4">
        <legend class="font-medium mb-2">Exercises (select all that apply)</legend>
        <div class="max-h-64 overflow-y-auto border rounded p-2 space-y-1">
            {% for ex in exercises %}
            <label class="flex items-center gap-2">
                <input type="checkbox" name="exercises" value="{{ ex.pk }}">
                <span>{{ ex.name }}</span>
                {% if ex.category %}
                <span class="text-xs text-gray-400">({{ ex.category.name }})</span>
                {% endif %}
            </label>
            {% empty %}
            <p class="text-gray-500 text-sm">No exercises found. <a href="{% url 'tracker:exercise_add' %}" class="text-blue-600 hover:underline">Add some</a> first.</p>
            {% endfor %}
        </div>
    </fieldset>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Create Template</button>
    <a href="{% url 'tracker:template_list' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
</form>

{% endblock %}
