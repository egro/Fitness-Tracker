{% extends "base.html" %}
{% block title %}Finish Workout{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Finish Workout</h1>

<form method="post" class="bg-white rounded-xl shadow p-4 max-w-md">
    {% csrf_token %}
    <label class="block mb-3">
        <span class="text-gray-700">Duration (minutes)</span>
        <input type="number" name="duration" step="1" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>
    <label class="block mb-4">
        <span class="text-gray-700">Notes</span>
        <textarea name="notes" rows="3" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"></textarea>
    </label>
    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Save &amp; Finish</button>
    <a href="{% url 'tracker:workout_detail' workout.pk %}" class="ml-2 text-gray-600 hover:underline">Back</a>
</form>

{% endblock %}
