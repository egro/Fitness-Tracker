{% extends "base.html" %}
{% block title %}Log Weight{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Log Weight</h1>

<form method="post" class="bg-white rounded-xl shadow p-4 max-w-md">
    {% csrf_token %}
    <label class="block mb-3">
        <span class="text-gray-700">Date</span>
        <input type="date" name="date" value="{{ today }}" max="{{ max_date }}" required
               class="mt-1 block w-full rounded border-gray-300 border px-3 py-2">
    </label>

    <div class="mb-3">
        <label class="block">
            <span class="text-gray-700 text-sm font-medium">Weight (lbs)</span>
            <input type="number" name="weight" step="0.1" inputmode="decimal"
                   class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"
                   placeholder="0.0">
        </label>
    </div>

    <label class="block mb-4">
        <span class="text-gray-700">Notes</span>
        <textarea name="notes" rows="2" class="mt-1 block w-full rounded border-gray-300 border px-3 py-2"></textarea>
    </label>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
    <a href="{% url 'tracker:weight_list' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
</form>



{% endblock %}
